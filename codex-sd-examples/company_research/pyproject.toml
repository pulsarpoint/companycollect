[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-research"
version = "0.15.3"
description = "Objective-driven company research with Crawl4AI and DeepSeek"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "click>=8.1,<9",
    "clickhouse-driver>=0.2.9,<0.3",
    "cloakbrowser>=0.5.10,<0.6",
    "crawl4ai>=0.9.3,<0.10",
    "defusedxml>=0.7,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "tldextract>=5,<6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
company-research = "company_research.cli:main"
company-research-submit = "company_research.cli:submit"
company-technology-mcp = "company_research.catalog_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_research"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
