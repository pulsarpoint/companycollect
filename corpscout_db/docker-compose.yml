services:
  postgres:
    image: postgres:17
    container_name: ppoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORPSCOUT_DB:-corpscout}
      POSTGRES_USER: ${CORPSCOUT_USER:-corpscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_DIR:-/opt/corpscoutdb/data}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDR:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on

