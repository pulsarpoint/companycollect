[project]
name = "finland-conformance"
version = "0.1.0"
description = "Finland raw -> canonical Parquet conformance notebook"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.9",
    "polars>=1.0",
    "pyarrow>=17",
    "duckdb>=1.1",
    "boto3>=1.34",
    "requests>=2.32",
    "lxml>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
