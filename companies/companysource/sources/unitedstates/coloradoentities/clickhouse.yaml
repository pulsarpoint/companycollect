database: corpscout_sources
source_prefix: us_coloradoentities
tables:
  companies:
    parquet: companies.parquet
    table: us_coloradoentities_companies
    engine: ReplacingMergeTree
    order_by: [entity_id, source_run_id]
    inject_columns: &ingest_columns
      source_export_id: UUID
      ingested_at: "DateTime64(3, 'UTC')"
  company_names:
    parquet: company_names.parquet
    table: us_coloradoentities_company_names
    engine: ReplacingMergeTree
    order_by: [entity_id, name_type, source_item_hash]
    inject_columns: *ingest_columns
  legal_forms:
    parquet: legal_forms.parquet
    table: us_coloradoentities_legal_forms
    engine: ReplacingMergeTree
    order_by: [entity_id, entity_type_code, source_item_hash]
    inject_columns: *ingest_columns
  addresses:
    parquet: addresses.parquet
    table: us_coloradoentities_addresses
    engine: ReplacingMergeTree
    order_by: [entity_id, address_role, source_item_hash]
    inject_columns: *ingest_columns
  registered_agents:
    parquet: registered_agents.parquet
    table: us_coloradoentities_registered_agents
    engine: ReplacingMergeTree
    order_by: [entity_id, agent_type, source_item_hash]
    inject_columns: *ingest_columns
  identifiers:
    parquet: identifiers.parquet
    table: us_coloradoentities_identifiers
    engine: ReplacingMergeTree
    order_by: [entity_id, identifier_type, identifier_value, source_item_hash]
    inject_columns: *ingest_columns
  source_evidence:
    parquet: source_evidence.parquet
    table: us_coloradoentities_source_evidence
    engine: ReplacingMergeTree
    order_by: [entity_id, source_payload_hash]
    inject_columns: *ingest_columns
