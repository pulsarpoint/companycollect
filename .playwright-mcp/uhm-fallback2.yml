        - heading "Upphandlingsmyndigheten statistics" [level=1] [ref=f3e62]
        - generic [ref=f3e63]:
          - generic [ref=f3e64]: Upphandlingsmyndigheten (Swedish National Agency for Public Procurement)
          - generic [ref=f3e65]: SE
      - generic [ref=f3e66]:
        - generic [ref=f3e67]:
          - generic [ref=f3e68]: About this register
          - generic [ref=f3e69]: Advertised Swedish procurement. Excludes direct and non-advertised procurement, missing after-notices, and many framework call-offs. Publishes no contract value at all -- none of its 44 columns is monetary.
        - generic [ref=f3e71]:
          - generic [ref=f3e72]:
            - term [ref=f3e73]: Grain
            - definition [ref=f3e74]: one row per (procurement, lot, supplier)
          - generic [ref=f3e75]:
            - term [ref=f3e76]: Licence
            - definition [ref=f3e77]: Swedish public sector open data
          - generic [ref=f3e78]:
            - term [ref=f3e79]: How we obtain it
            - definition [ref=f3e80]: Downloaded. A single bulk CSV of every advertised procurement, 44 columns, replaced wholesale each refresh. This file is the entire Swedish source -- there is no API behind it.
          - generic [ref=f3e81]:
            - term [ref=f3e82]: Read from
            - definition [ref=f3e83]:
              - link "https://catalog.upphandlingsmyndigheten.se/store/12/resource/239" [ref=f3e84] [cursor=pointer]:
                - /url: https://catalog.upphandlingsmyndigheten.se/store/12/resource/239
          - generic [ref=f3e85]:
            - term [ref=f3e86]: Homepage
            - definition [ref=f3e87]:
              - link "https://www.upphandlingsmyndigheten.se" [ref=f3e88] [cursor=pointer]:
                - /url: https://www.upphandlingsmyndigheten.se
          - generic [ref=f3e89]:
            - term [ref=f3e90]: Open tenders
            - definition [ref=f3e91]: No single portal — see notes
          - generic [ref=f3e92]:
            - term [ref=f3e93]: Notes
            - definition [ref=f3e94]: "Sweden has no single national tender portal: notices are spread across registered commercial ad databases, chiefly Mercell, e-Avrop and KommersAnnons, which is why every award here names the database it was advertised in. Suppliers may be natural persons as well as companies, so rows carry a person/company classification and only companies are matched to the register."
      - generic [ref=f3e95]:
        - generic [ref=f3e96]:
          - generic [ref=f3e97]: What we hold
          - generic [ref=f3e98]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=f3e100]:
          - generic [ref=f3e101]:
            - generic [ref=f3e102]: SE
            - generic [ref=f3e103]: 2021-01-01 → 2026-07-24
          - paragraph [ref=f3e104]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
