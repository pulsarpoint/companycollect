      - generic [ref=f3e68]:
        - generic [ref=f3e69]:
          - generic [ref=f3e70]: About this register
          - generic [ref=f3e71]: EU-wide publication of procurement above the directive thresholds. A contract below its country's threshold is not published here at all, so TED alone understates any country's procurement -- which is why each country pairs it with a national register.
        - generic [ref=f3e73]:
          - generic [ref=f3e74]:
            - term [ref=f3e75]: Grain
            - definition [ref=f3e76]: one row per (notice, lot, winning tenderer)
          - generic [ref=f3e77]:
            - term [ref=f3e78]: Licence
            - definition [ref=f3e79]: Reuse permitted under Decision 2011/833/EU, attribution required
          - generic [ref=f3e80]:
            - term [ref=f3e81]: How we obtain it
            - definition [ref=f3e82]: "Fetched. Search API for the notice listing, then one eForms UBL XML per notice from ted.europa.eu/en/notice/{id}/xml. Both are snapshotted to S3 before parsing."
          - generic [ref=f3e83]:
            - term [ref=f3e84]: Read from
            - definition [ref=f3e85]:
              - link "https://api.ted.europa.eu/v3/notices/search" [ref=f3e86] [cursor=pointer]:
                - /url: https://api.ted.europa.eu/v3/notices/search
          - generic [ref=f3e87]:
            - term [ref=f3e88]: Homepage
            - definition [ref=f3e89]:
              - link "https://ted.europa.eu" [ref=f3e90] [cursor=pointer]:
                - /url: https://ted.europa.eu
          - generic [ref=f3e91]:
            - term [ref=f3e92]: Open tenders
            - definition [ref=f3e93]:
              - link "https://ted.europa.eu/en/search/result" [ref=f3e94] [cursor=pointer]:
                - /url: https://ted.europa.eu/en/search/result
          - generic [ref=f3e95]:
            - term [ref=f3e96]: Notes
            - definition [ref=f3e97]: eForms UBL XML per notice. Publishes ten distinct monetary elements across notice, lot and winner grain, including framework ceilings that are not spend.
      - generic [ref=f3e98]:
        - generic [ref=f3e99]:
          - generic [ref=f3e100]: What we hold
          - generic [ref=f3e101]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=f3e102]:
          - generic [ref=f3e103]:
            - generic [ref=f3e104]:
              - generic [ref=f3e105]: FI
              - generic [ref=f3e106]: 2024-01-02 → 2026-07-24
            - paragraph [ref=f3e107]: Hilma national awards and TED eForms awards. Hilma publishes a realized value per lot, which is one company's amount where a lot has a single winner and a shared figure where several split it. TED adds an amount per winner.
          - generic [ref=f3e108]:
            - generic [ref=f3e109]:
              - generic [ref=f3e110]: "NO"
              - generic [ref=f3e111]: 2024-01-03 → 2026-07-24
            - paragraph [ref=f3e112]: TED eForms awards only; Doffin, Norway's national procurement register, is not ingested, so contracts below the EU publication thresholds are absent entirely.
          - generic [ref=f3e113]:
            - generic [ref=f3e114]:
              - generic [ref=f3e115]: SE
              - generic [ref=f3e116]: 2021-01-01 → 2026-07-24
            - paragraph [ref=f3e117]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
