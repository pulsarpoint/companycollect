        - button "← Procurement sources" [ref=f6e61] [cursor=pointer]
        - heading "Portal Nacional de Contratações Públicas (PNCP)" [level=1] [ref=f6e62]
        - generic [ref=f6e63]:
          - generic [ref=f6e64]: Serpro, for the Brazilian federal government
          - generic [ref=f6e65]: BR
      - generic [ref=f6e66]:
        - generic [ref=f6e67]:
          - generic [ref=f6e68]: About this register
          - generic [ref=f6e69]: Federal, state and municipal contracts under Lei 14.133/2021. Publishes a value per contract per supplier, so a Brazilian award carries an amount attributable to the company. Adoption was partial before the law took full effect, so early years are thin.
        - generic [ref=f6e71]:
          - generic [ref=f6e72]:
            - term [ref=f6e73]: Grain
            - definition [ref=f6e74]: one row per (contract, supplier)
          - generic [ref=f6e75]:
            - term [ref=f6e76]: Licence
            - definition [ref=f6e77]: Brazilian open government data (Lei 12.527/2011)
          - generic [ref=f6e78]:
            - term [ref=f6e79]: How we obtain it
            - definition [ref=f6e80]: Fetched. Paginated consultation API, 500 records a page, read by publication month and then daily by publication and update date. No bulk download exists.
          - generic [ref=f6e81]:
            - term [ref=f6e82]: Read from
            - definition [ref=f6e83]:
              - link "https://pncp.gov.br/api/consulta/v1/contratos" [ref=f6e84] [cursor=pointer]:
                - /url: https://pncp.gov.br/api/consulta/v1/contratos
          - generic [ref=f6e85]:
            - term [ref=f6e86]: Homepage
            - definition [ref=f6e87]:
              - link "https://www.gov.br/pncp/" [ref=f6e88] [cursor=pointer]:
                - /url: https://www.gov.br/pncp/
          - generic [ref=f6e89]:
            - term [ref=f6e90]: Open tenders
            - definition [ref=f6e91]:
              - link "https://pncp.gov.br/app/editais" [ref=f6e92] [cursor=pointer]:
                - /url: https://pncp.gov.br/app/editais
          - generic [ref=f6e93]:
            - term [ref=f6e94]: Notes
            - definition [ref=f6e95]: No bulk download exists -- confirmed against portaldatransparencia and dadosabertos.compras.gov.br -- so the whole register is read through a rate-limited paginated API.
      - generic [ref=f6e96]:
        - generic [ref=f6e97]:
          - generic [ref=f6e98]: What we hold
          - generic [ref=f6e99]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=f6e101]:
          - generic [ref=f6e102]:
            - generic [ref=f6e103]: BR
            - generic [ref=f6e104]: 2022-01-06 → 2022-01-25
          - paragraph [ref=f6e105]: PNCP contract records only. Brazil is not in the EU, so there is no TED to complement it. PNCP publishes a value per contract per supplier, so Brazilian awards carry an amount attributable to the company rather than a notice-level total.
