      - generic [ref=f2e68]:
        - generic [ref=f2e69]:
          - generic [ref=f2e70]: About this register
          - generic [ref=f2e71]: EU-wide publication of procurement above the directive thresholds. A contract below its country's threshold is not published here at all, so TED alone understates any country's procurement -- which is why each country pairs it with a national register.
        - generic [ref=f2e73]:
          - generic [ref=f2e74]:
            - term [ref=f2e75]: Grain
            - definition [ref=f2e76]: one row per (notice, lot, winning tenderer)
          - generic [ref=f2e77]:
            - term [ref=f2e78]: Licence
            - definition [ref=f2e79]: Reuse permitted under Decision 2011/833/EU, attribution required
          - generic [ref=f2e80]:
            - term [ref=f2e81]: How we obtain it
            - definition [ref=f2e82]: "Fetched. Search API for the notice listing, then one eForms UBL XML per notice from ted.europa.eu/en/notice/{id}/xml. Both are snapshotted to S3 before parsing."
          - generic [ref=f2e83]:
            - term [ref=f2e84]: Read from
            - definition [ref=f2e85]:
              - link "https://api.ted.europa.eu/v3/notices/search" [ref=f2e86] [cursor=pointer]:
                - /url: https://api.ted.europa.eu/v3/notices/search
          - generic [ref=f2e87]:
            - term [ref=f2e88]: Homepage
            - definition [ref=f2e89]:
              - link "https://ted.europa.eu" [ref=f2e90] [cursor=pointer]:
                - /url: https://ted.europa.eu
          - generic [ref=f2e91]:
            - term [ref=f2e92]: Open tenders
            - definition [ref=f2e93]:
              - link "https://ted.europa.eu/en/search/result" [ref=f2e94] [cursor=pointer]:
                - /url: https://ted.europa.eu/en/search/result
          - generic [ref=f2e95]:
            - term [ref=f2e96]: Notes
            - definition [ref=f2e97]: eForms UBL XML per notice. Publishes ten distinct monetary elements across notice, lot and winner grain, including framework ceilings that are not spend.
      - generic [ref=f2e98]:
        - generic [ref=f2e99]:
          - generic [ref=f2e100]: What we hold
          - generic [ref=f2e101]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=f2e102]:
          - generic [ref=f2e103]:
            - generic [ref=f2e104]:
              - generic [ref=f2e105]: FI
              - generic [ref=f2e106]: 2024-01-02 → 2026-07-24
            - paragraph [ref=f2e107]: Hilma national awards and TED eForms awards. Hilma publishes a realized value per lot, which is one company's amount where a lot has a single winner and a shared figure where several split it. TED adds an amount per winner.
          - generic [ref=f2e108]:
            - generic [ref=f2e109]:
              - generic [ref=f2e110]: "NO"
              - generic [ref=f2e111]: 2024-01-03 → 2026-07-24
            - paragraph [ref=f2e112]: TED eForms awards only; Doffin, Norway's national procurement register, is not ingested, so contracts below the EU publication thresholds are absent entirely.
          - generic [ref=f2e113]:
            - generic [ref=f2e114]:
              - generic [ref=f2e115]: SE
              - generic [ref=f2e116]: 2021-01-01 → 2026-07-24
            - paragraph [ref=f2e117]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
