          - generic [ref=f2e69]:
            - generic [ref=f2e70]: About this register
            - generic [ref=f2e71]: EU-wide publication of procurement above the directive thresholds. A contract below its country's threshold is not published here at all, so TED alone understates any country's procurement -- which is why each country pairs it with a national register.
          - generic [ref=f2e73]:
            - generic [ref=f2e74]:
              - term [ref=f2e75]: Grain
              - definition [ref=f2e76]: one row per (notice, lot, winning tenderer)
            - generic [ref=f2e77]:
              - term [ref=f2e78]: Licence
              - definition [ref=f2e79]: Reuse permitted under Decision 2011/833/EU, attribution required
            - generic [ref=f2e80]:
              - term [ref=f2e81]: How we obtain it
              - definition [ref=f2e82]: "Fetched. Search API for the notice listing, then one eForms UBL XML per notice from ted.europa.eu/en/notice/{id}/xml. Both are snapshotted to S3 before parsing."
            - generic [ref=f2e83]:
              - term [ref=f2e84]: Read from
              - definition [ref=f2e85]:
                - link [ref=f2e2028] [cursor=pointer]:
                  - /url: https://api.ted.europa.eu/v3/notices/search
                  - text: https://api.ted.europa.eu/v3/notices/search
            - generic [ref=f2e87]:
              - term [ref=f2e88]: Homepage
              - definition [ref=f2e89]:
                - link [ref=f2e2029] [cursor=pointer]:
                  - /url: https://ted.europa.eu
                  - text: https://ted.europa.eu
            - generic [ref=f2e91]:
