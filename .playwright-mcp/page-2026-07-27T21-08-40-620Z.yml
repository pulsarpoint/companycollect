      - generic [ref=e68]:
        - generic [ref=e69]:
          - generic [ref=e70]: About this register
          - generic [ref=e71]: EU-wide publication of procurement above the directive thresholds. A contract below its country's threshold is not published here at all, so TED alone understates any country's procurement -- which is why each country pairs it with a national register.
        - generic [ref=e73]:
          - generic [ref=e74]:
            - term [ref=e75]: Grain
            - definition [ref=e76]: one row per (notice, lot, winning tenderer)
          - generic [ref=e77]:
            - term [ref=e78]: Licence
            - definition [ref=e79]: Reuse permitted under Decision 2011/833/EU, attribution required
          - generic [ref=e80]:
            - term [ref=e81]: How we obtain it
            - definition [ref=e82]: "Fetched. Search API for the notice listing, then one eForms UBL XML per notice from ted.europa.eu/en/notice/{id}/xml. Both are snapshotted to S3 before parsing."
          - generic [ref=e83]:
            - term [ref=e84]: Read from
            - definition [ref=e85]:
              - link "https://api.ted.europa.eu/v3/notices/search" [ref=e86] [cursor=pointer]:
                - /url: https://api.ted.europa.eu/v3/notices/search
          - generic [ref=e87]:
            - term [ref=e88]: Homepage
            - definition [ref=e89]:
              - link "https://ted.europa.eu" [ref=e90] [cursor=pointer]:
                - /url: https://ted.europa.eu
          - generic [ref=e91]:
            - term [ref=e92]: Open tenders
            - definition [ref=e93]:
              - link "https://ted.europa.eu/en/search/result" [ref=e94] [cursor=pointer]:
                - /url: https://ted.europa.eu/en/search/result
          - generic [ref=e95]:
            - term [ref=e96]: Notes
            - definition [ref=e97]: eForms UBL XML per notice. Publishes ten distinct monetary elements across notice, lot and winner grain, including framework ceilings that are not spend.
      - generic [ref=e98]:
        - generic [ref=e99]:
          - generic [ref=e100]: What we hold
          - generic [ref=e101]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=e102]:
          - generic [ref=e103]:
            - generic [ref=e104]:
              - generic [ref=e105]: FI
              - generic [ref=e106]: 2024-01-02 → 2026-07-24
            - paragraph [ref=e107]: Hilma national awards and TED eForms awards. Hilma publishes a realized value per lot, which is one company's amount where a lot has a single winner and a shared figure where several split it. TED adds an amount per winner.
          - generic [ref=e108]:
            - generic [ref=e109]:
              - generic [ref=e110]: "NO"
              - generic [ref=e111]: 2024-01-03 → 2026-07-24
            - paragraph [ref=e112]: TED eForms awards only; Doffin, Norway's national procurement register, is not ingested, so contracts below the EU publication thresholds are absent entirely.
          - generic [ref=e113]:
            - generic [ref=e114]:
              - generic [ref=e115]: SE
              - generic [ref=e116]: 2021-01-01 → 2026-07-24
            - paragraph [ref=e117]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
