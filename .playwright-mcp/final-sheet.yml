            - generic [ref=e70]: About this register
            - generic [ref=e71]: EU-wide publication of procurement above the directive thresholds. A contract below its country's threshold is not published here at all, so TED alone understates any country's procurement -- which is why each country pairs it with a national register.
          - generic [ref=e73]:
            - generic [ref=e74]:
              - term [ref=e75]: Grain
              - definition [ref=e76]: one row per (notice, lot, winning tenderer)
            - generic [ref=e77]:
              - term [ref=e78]: Licence
              - definition [ref=e79]: Reuse permitted under Decision 2011/833/EU, attribution required
            - generic [ref=e80]:
              - term [ref=e81]: How we obtain it
              - definition [ref=e82]: "Fetched. Search API for the notice listing, then one eForms UBL XML per notice from ted.europa.eu/en/notice/{id}/xml. Both are snapshotted to S3 before parsing."
            - generic [ref=e83]:
              - term [ref=e84]: Read from
              - definition [ref=e85]:
                - link [ref=e2929] [cursor=pointer]:
