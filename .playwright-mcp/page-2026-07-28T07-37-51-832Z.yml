          - generic [ref=e65]: SE
      - generic [ref=e66]:
        - generic [ref=e67]:
          - generic [ref=e68]: About this register
          - generic [ref=e69]: Advertised Swedish procurement. Excludes direct and non-advertised procurement, missing after-notices, and many framework call-offs. Publishes no contract value at all -- none of its 44 columns is monetary.
        - generic [ref=e71]:
          - generic [ref=e72]:
            - term [ref=e73]: Grain
            - definition [ref=e74]: one row per (procurement, lot, supplier)
          - generic [ref=e75]:
            - term [ref=e76]: Licence
            - definition [ref=e77]: Swedish public sector open data
          - generic [ref=e78]:
            - term [ref=e79]: How we obtain it
            - definition [ref=e80]: Downloaded. A single bulk CSV of every advertised procurement, 44 columns, replaced wholesale each refresh. This file is the entire Swedish source -- there is no API behind it.
          - generic [ref=e81]:
            - term [ref=e82]: Read from
            - definition [ref=e83]:
              - link "https://catalog.upphandlingsmyndigheten.se/store/12/resource/239" [ref=e84] [cursor=pointer]:
                - /url: https://catalog.upphandlingsmyndigheten.se/store/12/resource/239
          - generic [ref=e85]:
            - term [ref=e86]: Homepage
            - definition [ref=e87]:
              - link "https://www.upphandlingsmyndigheten.se" [ref=e88] [cursor=pointer]:
                - /url: https://www.upphandlingsmyndigheten.se
          - generic [ref=e89]:
            - term [ref=e90]: Open tenders
            - definition [ref=e91]: No single portal — see notes
          - generic [ref=e92]:
            - term [ref=e93]: Notes
            - definition [ref=e94]: "Sweden has no single national tender portal: notices are spread across registered commercial ad databases, chiefly Mercell, e-Avrop and KommersAnnons, which is why every award here names the database it was advertised in. Suppliers may be natural persons as well as companies, so rows carry a person/company classification and only companies are matched to the register."
      - generic [ref=e95]:
        - generic [ref=e96]:
          - generic [ref=e97]: What we hold
          - generic [ref=e98]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=e100]:
          - generic [ref=e101]:
            - generic [ref=e102]: SE
            - generic [ref=e103]: 2021-01-01 → 2026-07-24
          - paragraph [ref=e104]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
