      - generic [ref=f1e68]:
        - generic [ref=f1e69]:
          - generic [ref=f1e70]: About this register
          - generic [ref=f1e71]: EU-wide publication of procurement above the directive thresholds. A contract below its country's threshold is not published here at all, so TED alone understates any country's procurement -- which is why each country pairs it with a national register.
        - generic [ref=f1e73]:
          - generic [ref=f1e74]:
            - term [ref=f1e75]: Grain
            - definition [ref=f1e76]: one row per (notice, lot, winning tenderer)
          - generic [ref=f1e77]:
            - term [ref=f1e78]: Licence
            - definition [ref=f1e79]: Reuse permitted under Decision 2011/833/EU, attribution required
          - generic [ref=f1e80]:
            - term [ref=f1e81]: How we obtain it
            - definition [ref=f1e82]: "Fetched. Search API for the notice listing, then one eForms UBL XML per notice from ted.europa.eu/en/notice/{id}/xml. Both are snapshotted to S3 before parsing."
          - generic [ref=f1e83]:
            - term [ref=f1e84]: Read from
            - definition [ref=f1e85]:
              - link "https://api.ted.europa.eu/v3/notices/search" [ref=f1e86] [cursor=pointer]:
                - /url: https://api.ted.europa.eu/v3/notices/search
          - generic [ref=f1e87]:
            - term [ref=f1e88]: Homepage
            - definition [ref=f1e89]:
              - link "https://ted.europa.eu" [ref=f1e90] [cursor=pointer]:
                - /url: https://ted.europa.eu
          - generic [ref=f1e91]:
            - term [ref=f1e92]: Open tenders
            - definition [ref=f1e93]:
              - link "https://ted.europa.eu/en/search/result" [ref=f1e94] [cursor=pointer]:
                - /url: https://ted.europa.eu/en/search/result
          - generic [ref=f1e95]:
            - term [ref=f1e96]: Notes
            - definition [ref=f1e97]: eForms UBL XML per notice. Publishes ten distinct monetary elements across notice, lot and winner grain, including framework ceilings that are not spend.
      - generic [ref=f1e98]:
        - generic [ref=f1e99]:
          - generic [ref=f1e100]: What we hold
          - generic [ref=f1e101]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=f1e102]:
          - generic [ref=f1e103]:
            - generic [ref=f1e104]:
              - generic [ref=f1e105]: FI
              - generic [ref=f1e106]: 2024-01-02 → 2026-07-24
            - paragraph [ref=f1e107]: Hilma national awards and TED eForms awards. Hilma publishes a realized value per lot, which is one company's amount where a lot has a single winner and a shared figure where several split it. TED adds an amount per winner.
          - generic [ref=f1e108]:
            - generic [ref=f1e109]:
              - generic [ref=f1e110]: "NO"
              - generic [ref=f1e111]: 2024-01-03 → 2026-07-24
            - paragraph [ref=f1e112]: TED eForms awards only; Doffin, Norway's national procurement register, is not ingested, so contracts below the EU publication thresholds are absent entirely.
          - generic [ref=f1e113]:
            - generic [ref=f1e114]:
              - generic [ref=f1e115]: SE
              - generic [ref=f1e116]: 2021-01-01 → 2026-07-24
            - paragraph [ref=f1e117]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
