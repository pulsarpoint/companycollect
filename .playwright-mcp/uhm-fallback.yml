        - heading "Upphandlingsmyndigheten statistics" [level=1] [ref=f2e62]
        - generic [ref=f2e63]:
          - generic [ref=f2e64]: Upphandlingsmyndigheten (Swedish National Agency for Public Procurement)
          - generic [ref=f2e65]: SE
      - generic [ref=f2e66]:
        - generic [ref=f2e67]:
          - generic [ref=f2e68]: About this register
          - generic [ref=f2e69]: Advertised Swedish procurement. Excludes direct and non-advertised procurement, missing after-notices, and many framework call-offs. Publishes no contract value at all -- none of its 44 columns is monetary.
        - generic [ref=f2e71]:
          - generic [ref=f2e72]:
            - term [ref=f2e73]: Grain
            - definition [ref=f2e74]: one row per (procurement, lot, supplier)
          - generic [ref=f2e75]:
            - term [ref=f2e76]: Licence
            - definition [ref=f2e77]: Swedish public sector open data
          - generic [ref=f2e78]:
            - term [ref=f2e79]: How we obtain it
            - definition [ref=f2e80]: Downloaded. A single bulk CSV of every advertised procurement, 44 columns, replaced wholesale each refresh. This file is the entire Swedish source -- there is no API behind it.
          - generic [ref=f2e81]:
            - term [ref=f2e82]: Read from
            - definition [ref=f2e83]:
              - link "https://catalog.upphandlingsmyndigheten.se/store/12/resource/239" [ref=f2e84] [cursor=pointer]:
                - /url: https://catalog.upphandlingsmyndigheten.se/store/12/resource/239
          - generic [ref=f2e85]:
            - term [ref=f2e86]: Homepage
            - definition [ref=f2e87]:
              - link "https://www.upphandlingsmyndigheten.se" [ref=f2e88] [cursor=pointer]:
                - /url: https://www.upphandlingsmyndigheten.se
          - generic [ref=f2e89]:
            - term [ref=f2e90]: Open tenders
            - definition [ref=f2e91]: No single portal — see notes
          - generic [ref=f2e92]:
            - term [ref=f2e93]: Notes
            - definition [ref=f2e94]: "Sweden has no single national tender portal: notices are spread across registered commercial ad databases, chiefly Mercell, e-Avrop and KommersAnnons, which is why every award here names the database it was advertised in. Suppliers may be natural persons as well as companies, so rows carry a person/company classification and only companies are matched to the register."
      - generic [ref=f2e95]:
        - generic [ref=f2e96]:
          - generic [ref=f2e97]: What we hold
          - generic [ref=f2e98]: Per country, because a register serving several is loaded to a different depth in each. The caveat is about our coverage, not the register's scope.
        - generic [ref=f2e100]:
          - generic [ref=f2e101]:
            - generic [ref=f2e102]: SE
            - generic [ref=f2e103]: 2021-01-01 → 2026-07-24
          - paragraph [ref=f2e104]: UHM advertised procurement and TED eForms awards. Excludes direct/non-advertised procurement, missing after-notices, and many framework call-offs. UHM publishes no contract value at all, so Swedish awards carry none.
