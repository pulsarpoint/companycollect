# Ansible defaults for deploying pulsarprotectctlog. Run playbooks from this dir.
[defaults]
inventory = ./inventory.ini
roles_path = ./roles
# Vault key location so runs don't need --ask-vault-pass. One line, chmod 600,
# OUTSIDE the repo. Create it once:  install -m600 /dev/stdin ~/.config/ansible/ctlog-vault-pass
vault_password_file = ~/.config/ansible/ctlog-vault-pass
host_key_checking = True
retry_files_enabled = False
# YAML-formatted task output (the old `stdout_callback = yaml` plugin was
# removed; this is its replacement on the built-in callback).
callback_result_format = yaml
# Reuse your ~/.ssh/config (the `ctlogs` host alias, ProxyJump/Tailscale, etc.).
[ssh_connection]
pipelining = True
