[project]
name = "dagster-corpscout-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.9",
    "dagster-postgres>=0.26",
    "dagster-docker>=0.26",
    "boto3>=1.34",
    "requests>=2.32",
    "clickhouse-connect>=0.8",
    "lxml>=5.2",
    "dagster-dg-cli>=1.13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "responses>=0.25",
    "dagster-webserver>=1.13.9",
]

[project.scripts]
dagster-corpscout-scaffold-source = "dagster_corpscout.source_scaffold:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dagster_corpscout*"]

[tool.dagster]
module_name = "dagster_corpscout.definitions"

# `dg` CLI project recognition. Coexists with [tool.dagster] above, which the
# deployed `dagster api grpc -m dagster_corpscout.definitions` and `dagster dev`
# continue to use. This project uses the classic explicit-Definitions layout
# (dagster_corpscout/definitions.py), not the Components defs_module autoload.
[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_corpscout"
code_location_target_module = "dagster_corpscout.definitions"

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.9",
]
