[project]
name = "dagster_v3"
requires-python = ">=3.14,<3.15"
version = "0.1.0"
dependencies = [
    "boto3>=1.43.29",
    "clickhouse-connect>=0.10.0",
    "dagster==1.13.9",
    "dagster-clickhouse>=0.29.9",
    "dagster-dbt>=0.29.9",
    "dagster-dlt>=0.29.9",
    "dagster-duckdb>=0.29.9",
    "dagster-postgres>=0.29.9",
    "dbt-duckdb>=1.8,<1.9",
    "dlt[duckdb]>=1.27.2",
    "duckdb>=1.5.3",
    "ijson>=3.4.0",
    "lxml>=6.1.1",
    "mashumaro>=3.16,<4.0",
    "numpy>=2.5.0",
    "openai>=2.41.1",
    "polars[rtcompat]>=1.41.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "temporalio>=1.28.0",
    "tldextract>=5.3.0",
    "warcio>=1.8.1",
]

[project.scripts]
translator-worker = "translator.worker:worker_main"
translator-import-legacy-queue = "translator.import_legacy:main"

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_v3", "exchange_rates", "translator"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_v3"
registry_modules = [
    "dagster_v3.components.*",
]
