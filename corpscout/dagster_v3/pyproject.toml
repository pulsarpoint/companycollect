[project]
name = "dagster_v3"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "arelle-release>=2.41.4",
    "boto3>=1.43.29",
    "clickhouse-connect>=0.10.0",
    "dagster==1.13.9",
    "dagster-clickhouse>=0.29.9",
    "dagster-dbt>=0.29.9",
    "dagster-dlt>=0.29.9",
    "dagster-postgres>=0.29.9",
    "dbt-duckdb>=1.8,<1.9",
    "dlt[duckdb]>=1.27.2",
    "duckdb>=1.5.3",
    "ijson>=3.4.0",
    "lxml>=6.1.1",
    "mashumaro>=3.16,<4.0",
    "openai>=2.41.1",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "temporalio>=1.28.0",
]

[project.scripts]
translation-provider-smoke = "translations.provider_smoke:main"
translation-queue-smoke = "translations.queue_smoke:main"
translation-temporal-worker = "temporal.translations.queue_cli:worker_main"
translation-temporal-start = "temporal.translations.queue_cli:start_main"
translation-temporal-status = "temporal.translations.queue_cli:status_main"

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_v3", "translations", "temporal", "exchange_rates"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_v3"
registry_modules = [
    "dagster_v3.components.*",
]
