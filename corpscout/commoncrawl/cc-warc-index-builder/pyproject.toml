[project]
name = "cc-warc-index-builder"
version = "0.1.0"
description = "Build WARC-oriented catalogs from the Common Crawl Parquet URL Index."
requires-python = ">=3.14"
dependencies = [
    "duckdb==1.5.4",
    "httpx>=0.28.1,<1",
    "humanize>=4.12,<5",
]

[project.scripts]
cc-warc-index-builder = "warc_index_builder.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warc_index_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
