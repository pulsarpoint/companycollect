---
- name: Install unbound
  ansible.builtin.apt:
    name: [unbound, dns-root-data]
    state: present
    update_cache: true

- name: Install scanner.conf (tuned recursive resolver)
  ansible.builtin.template:
    src: scanner.conf.j2
    dest: /etc/unbound/unbound.conf.d/scanner.conf
    owner: root
    group: root
    mode: "0644"
    validate: "unbound-checkconf %s"
  notify: Restart unbound

- name: Ensure unbound systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/unbound.service.d/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Systemd drop-in — raise unbound LimitNOFILE
  ansible.builtin.template:
    src: unbound-limits.conf.j2
    dest: /etc/systemd/system/unbound.service.d/limits.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart unbound

- name: Enable + start unbound
  ansible.builtin.systemd_service:
    name: unbound
    enabled: true
    state: started
