---
- name: Persist nf_conntrack module loading
  ansible.builtin.copy:
    content: "nf_conntrack\n"
    dest: /etc/modules-load.d/cc-dns-scan.conf
    owner: root
    group: root
    mode: "0644"

- name: Load nf_conntrack module now
  ansible.builtin.command: modprobe nf_conntrack
  changed_when: false

- name: Install DNS sysctl tuning
  ansible.builtin.template:
    src: 99-cc-dns.conf.j2
    dest: /etc/sysctl.d/99-cc-dns.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Install nofile limits
  ansible.builtin.template:
    src: 99-cc-dns-limits.conf.j2
    dest: /etc/security/limits.d/99-cc-dns.conf
    owner: root
    group: root
    mode: "0644"

- name: Check ufw is not actively enforcing (installing iptables-persistent removes ufw)
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false

- name: Refuse to proceed if ufw is active
  ansible.builtin.assert:
    that: "'Status: active' not in ufw_status.stdout"
    fail_msg: "ufw is ACTIVE — installing iptables-persistent would remove it and could expose the host. Resolve manually first."

- name: Install iptables-persistent (persists the raw NOTRACK rules)
  ansible.builtin.apt:
    name: [iptables-persistent, netfilter-persistent]
    state: present
    update_cache: true

- name: DNS NOTRACK — replies (PREROUTING, source port 53)
  ansible.builtin.iptables:
    table: raw
    chain: PREROUTING
    protocol: "{{ item }}"
    source_port: "53"
    jump: NOTRACK
    comment: "cc-dns NOTRACK reply {{ item }}"
    state: present
  loop: [udp, tcp]
  notify: Persist iptables

- name: DNS NOTRACK — queries (OUTPUT, destination port 53)
  ansible.builtin.iptables:
    table: raw
    chain: OUTPUT
    protocol: "{{ item }}"
    destination_port: "53"
    jump: NOTRACK
    comment: "cc-dns NOTRACK query {{ item }}"
    state: present
  loop: [udp, tcp]
  notify: Persist iptables
