[project]
name = "cc-index-builder"
version = "0.1.0"
description = "Build per-domain worklists from the CommonCrawl columnar URL index (off-AWS, no dagster)."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=14",
]

[project.scripts]
cc-index-builder = "index_builder.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["index_builder"]
