[project]
name = "cc-reference-builder"
version = "0.1.0"
description = "Build the CommonCrawl NACE + page-type reference embeddings into ClickHouse (no dagster)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "clickhouse-driver>=0.2.9",
]

[project.scripts]
cc-reference-builder = "reference_builder.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference_builder"]
