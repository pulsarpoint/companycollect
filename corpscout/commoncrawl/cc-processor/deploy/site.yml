---
- name: Deploy the Common Crawl processing runtime
  hosts: commoncrawl_processors
  become: true
  gather_facts: true
  vars:
    commoncrawl_source_directory: "{{ playbook_dir }}/.."
    commoncrawl_artifact_directory: >-
      {{ commoncrawl_source_directory }}/dist/{{ commoncrawl_target_goos }}-{{ commoncrawl_target_goarch }}

  tasks:
    - name: Verify the target operating system and architecture
      ansible.builtin.assert:
        that:
          - ansible_facts["system"] == "Linux"
          - ansible_facts["architecture"] == commoncrawl_target_architecture
        fail_msg: >-
          Inventory requests {{ commoncrawl_target_goos }}/{{ commoncrawl_target_goarch }}, but
          {{ inventory_hostname }} reports
          {{ ansible_facts["system"] }}/{{ ansible_facts["architecture"] }}.

    - name: Test, vet, and build both Linux binaries on the control machine
      ansible.builtin.command:
        argv:
          - make
          - release
          - "TARGET_GOOS={{ commoncrawl_target_goos }}"
          - "TARGET_GOARCH={{ commoncrawl_target_goarch }}"
          - "DIST_DIR={{ commoncrawl_artifact_directory }}"
        chdir: "{{ commoncrawl_source_directory }}"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false

    - name: Verify both local release artifacts exist and are executable
      ansible.builtin.stat:
        path: "{{ commoncrawl_artifact_directory }}/{{ item }}"
      register: commoncrawl_local_binaries
      loop:
        - cc-crawl
        - cc-enrich-worker
      delegate_to: localhost
      become: false

    - name: Require both build artifacts
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.executable | default(false)
        fail_msg: "make release did not produce an executable {{ item.item }}."
      loop: "{{ commoncrawl_local_binaries.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require the processor environment file
      ansible.builtin.stat:
        path: "{{ commoncrawl_deploy_root }}/.env"
        follow: false
      register: commoncrawl_environment

    - name: Refuse to deploy without the processor environment file
      ansible.builtin.assert:
        that:
          - commoncrawl_environment.stat.isreg | default(false)
        fail_msg: >-
          Create {{ commoncrawl_deploy_root }}/.env before deploying the runtime.

    - name: Create the binary directories
      ansible.builtin.file:
        path: "{{ commoncrawl_deploy_root }}/{{ item }}/bin"
        state: directory
        owner: "{{ commoncrawl_owner }}"
        group: "{{ commoncrawl_group }}"
        mode: "0755"
      loop:
        - cc-crawl
        - cc-enrich-worker

    - name: Copy the binaries into place
      ansible.builtin.copy:
        src: "{{ commoncrawl_artifact_directory }}/{{ item }}"
        dest: "{{ commoncrawl_deploy_root }}/{{ item }}/bin/{{ item }}"
        owner: "{{ commoncrawl_owner }}"
        group: "{{ commoncrawl_group }}"
        mode: "0755"
      loop:
        - cc-crawl
        - cc-enrich-worker
      when: not ansible_check_mode

    - name: Validate the deployed cc-crawl binary
      ansible.builtin.command:
        argv: ["{{ commoncrawl_deploy_root }}/cc-crawl/bin/cc-crawl", -h]
      changed_when: false
      when: not ansible_check_mode

    - name: Validate the deployed cc-enrich-worker binary
      ansible.builtin.command:
        argv: ["{{ commoncrawl_deploy_root }}/cc-enrich-worker/bin/cc-enrich-worker", --help]
      changed_when: false
      when: not ansible_check_mode
