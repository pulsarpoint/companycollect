[project]
name = "czech-ocr-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ocrmypdf>=17.0.0",
    "paddleocr>=3.0.0",
    "pillow>=11.0.0",
    "pypdfium2>=5.0.0",
]

[project.optional-dependencies]
cpu = [
    "paddlepaddle>=3.0.0",
]
glm = [
    "glmocr>=0.1.5",
]

[project.scripts]
czech-ocr-benchmark = "czech_ocr_benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/czech_ocr_benchmark"]
