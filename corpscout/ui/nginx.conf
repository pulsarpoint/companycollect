server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $scheduler_backend http://scheduler:8090;

    location /api/v1/ {
        proxy_pass $scheduler_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_backend_unavailable;
    }

    location /assets/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location @api_backend_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":"api backend unavailable","message":"scheduler service is unavailable or restarting"}';
    }
}
