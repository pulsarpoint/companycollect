# Managed by the Webtech DNS playbook. No forward-zone: recurse from root hints.
server:
    interface: 127.0.0.1
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    do-ip6: no
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    root-hints: "/usr/share/dns/root.hints"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    num-threads: 2
    so-reuseport: yes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    prefetch: yes
    qname-minimisation: yes
    edns-buffer-size: 1232
    hide-identity: yes
    hide-version: yes

remote-control:
    control-enable: yes
    control-interface: "/run/unbound.ctl"
    control-use-cert: no
