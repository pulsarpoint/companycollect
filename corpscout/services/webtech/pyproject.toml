[project]
name = "webtech"
version = "0.1.0"
description = "Isolated local CloakBrowser Wappalyzer benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.90,<1.43",
    "click>=8.1.8",
    "cloakbrowser>=0.5.8",
    "fastapi>=0.135.1,<1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.13.1,<3",
    "uvicorn>=0.42.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.0.2,<10",
    "ruff>=0.15.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
