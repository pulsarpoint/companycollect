[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-temporal-prototype"
version = "0.1.0"
description = "Isolated experiment for resumable domain processing with Temporal"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.18,<2", "click>=8,<9"]

[project.scripts]
domain-prototype = "domain_prototype.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/domain_prototype"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
