type: dagster_v3.components.company_domain_suggestions_dbt.CompanyDomainWebFeaturesDbtComponent

attributes:
  project: '{{ context.project_root }}/src/dagster_v3/defs/company_domain_suggestions/dbt'
  cli_args: [build]
  select: tag:company_domain_web_features
  include_metadata: [row_count]
