type: dagster_v3.components.company_domain_suggestions_dbt.CompanyDomainSuggestionsDbtComponent

attributes:
  project: '{{ context.project_root }}/src/dagster_v3/defs/company_domain_suggestions/dbt'
  cli_args: [build]
  exclude: tag:company_domain_web_features
  include_metadata: [row_count]
  op:
    name: company_domain_suggestions_dbt
    pool: company_domain_suggestions_clickhouse_dbt
    backfill_policy:
      type: multi_run
      max_partitions_per_run: 1
  translation:
    group_name: company_domain_suggestions_dbt
    kinds: [dbt, clickhouse]
    partitions_def:
      type: static
      partition_keys: [SE]
  translation_settings:
    enable_asset_checks: true
    enable_source_tests_as_checks: true
  prepare_if_dev: true
