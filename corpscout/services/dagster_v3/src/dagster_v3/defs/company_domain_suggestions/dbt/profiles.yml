company_domain_suggestions:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'corpscout') }}"
      secure: "{{ env_var('CLICKHOUSE_SECURE', 'false') | lower == 'true' }}"
      connect_timeout: 30
      send_receive_timeout: 3600
      threads: 4
