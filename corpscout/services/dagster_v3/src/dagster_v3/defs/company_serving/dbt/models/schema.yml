          key_columns: [country_code, company_id]
      - company_serving_sweden_anchor

  - name: se_company_industry_display_current_build
    data_tests:
      - company_serving_unique_key:
          key_columns: [company_id, is_primary, classification_system, classification_code]
      - company_serving_sweden_anchor

  - name: se_company_address_display_current_build
    data_tests:
      - company_serving_unique_key:
