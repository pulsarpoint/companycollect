version: 2

models:
  - name: company_external_identifier_current_build
    data_tests:
      - company_serving_unique_key:
          key_columns: [country_code, company_id, identifier_scheme, is_primary, identifier_value]
      - company_serving_sweden_anchor
    columns:
      - name: country_code
        data_tests: [not_null]
      - name: company_id
        data_tests: [not_null]
      - name: identifier_scheme
        data_tests: [not_null]
      - name: identifier_value
        data_tests: [not_null]

  - name: company_gleif_current_build
    data_tests:
      - company_serving_unique_key:
          key_columns: [country_code, company_id, is_primary, lei]
      - company_serving_sweden_anchor
    columns:
      - name: company_id
        data_tests: [not_null]
      - name: lei
        data_tests: [not_null]

  - name: company_gleif_relationship_current_build
    data_tests:
      - company_serving_unique_key:
          key_columns: [country_code, company_id, direction, relationship_type, relationship_id]
      - company_serving_sweden_anchor

  - name: company_wikidata_current_build
    data_tests:
      - company_serving_unique_key:
          key_columns: [country_code, company_id, is_primary, wikidata_id]
      - company_serving_sweden_anchor
    columns:
      - name: company_id
        data_tests: [not_null]
      - name: wikidata_id
        data_tests: [not_null]

  - name: company_management_current_build
    data_tests:
