          key_columns: [country_code, company_id, description_kind, description_id]
      - company_serving_sweden_anchor

  - name: company_contact_current_build
    data_tests:
      - company_serving_unique_key:
          key_columns: [country_code, company_id, contact_type, contact_id]
      - company_serving_sweden_anchor

  - name: company_domains_build
