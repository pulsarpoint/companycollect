type: dagster_v3.components.ratsit_temporal_component.RatsitTemporalComponent

attributes:
  dispatch_asset:
    key: se_ratsit_scan_dispatch
    deps: [se_company_info_clickhouse]
    description: >-
      Selects active Swedish companies that have never been scanned, have a
      successful Ratsit scan older than 20 days, or have passed the failure
      cooldown, then starts one durable Temporal workflow per company.
    group_name: sweden_ratsit
    kinds: [python, clickhouse, temporal, ratsit]
  coverage_asset:
    key: se_ratsit_scan_coverage
    deps: [se_company_info_clickhouse]
    description: >-
      Reports active-company Ratsit coverage, freshness, failures, retry
      eligibility, and the latest completed batch from ClickHouse.
    group_name: sweden_ratsit
    kinds: [python, clickhouse, temporal, ratsit]
  temporal_address: companycollect:7233
  temporal_namespace: corpscout
  temporal_task_queue: ratsit-crawler
  freshness_days: 20
  failure_cooldown_hours: 24
  max_batch_size: 5000
