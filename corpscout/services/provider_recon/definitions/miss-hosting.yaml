# yaml-language-server: $schema=./schema.json
slug: miss-hosting
display_name: Miss Hosting
category: hosting
country: SE
aliases: ["Miss Hosting"]
provider_keys: ["misshosting.com"]
services:
  - key: miss-hosting.email
    display_name: Miss Hosting email
    service_types: [email]
    dns_rules:
      - {record_type: MX, match_field: target, matcher_type: suffix, pattern: "misshosting.com"}
