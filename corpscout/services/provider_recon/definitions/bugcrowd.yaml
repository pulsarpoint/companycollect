# yaml-language-server: $schema=./schema.json
slug: bugcrowd
display_name: "Bugcrowd"
category: security
website: https://www.bugcrowd.com
aliases: ["Bugcrowd"]
provider_keys: []
services:
  - key: bugcrowd.verification
    display_name: "Bugcrowd domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (Bugcrowd)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "bugcrowd-verification"}
