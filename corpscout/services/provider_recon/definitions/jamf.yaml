category: security
website: https://www.jamf.com
aliases: ["Jamf"]
provider_keys: []
services:
  - key: jamf.verification
    display_name: "Jamf domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (Jamf)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "jamf-site-verification="}
