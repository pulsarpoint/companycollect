# yaml-language-server: $schema=./schema.json
slug: atlassian
display_name: Atlassian
category: saas
country: US
services:
  - key: atlassian.domain-verification
    display_name: Atlassian domain verification
    service_types: [saas_verification]
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "atlassian-domain-verification=", confidence: 0.9}
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "atlassian-sending-domain-verification="}
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "status-page-domain-verification="}
