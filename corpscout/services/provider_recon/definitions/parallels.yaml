# yaml-language-server: $schema=./schema.json
slug: parallels
display_name: "Parallels"
category: saas
website: https://www.parallels.com
aliases: ["Parallels"]
provider_keys: []
services:
  - key: parallels.verification
    display_name: "Parallels domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (Parallels)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "parallels-domain-verification="}
