# yaml-language-server: $schema=./schema.json
slug: globalsign
display_name: GlobalSign
category: security
country: BE
services:
  - key: globalsign.domain-verification
    display_name: GlobalSign domain verification
    service_types: [saas_verification]
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "globalsign-domain-verification=", confidence: 0.85}
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "_globalsign-domain-verification="}
