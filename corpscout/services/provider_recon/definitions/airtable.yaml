# yaml-language-server: $schema=./schema.json
slug: airtable
display_name: "Airtable"
category: saas
website: https://www.airtable.com
aliases: ["Airtable"]
provider_keys: []
services:
  - key: airtable.verification
    display_name: "Airtable domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (Airtable)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "airtable-verification="}
