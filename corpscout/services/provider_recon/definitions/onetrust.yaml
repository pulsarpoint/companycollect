# yaml-language-server: $schema=./schema.json
slug: onetrust
display_name: "OneTrust"
category: saas
website: https://www.onetrust.com
aliases: ["OneTrust"]
provider_keys: []
services:
  - key: onetrust.verification
    display_name: "OneTrust domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (OneTrust)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "onetrust-domain-verification="}
