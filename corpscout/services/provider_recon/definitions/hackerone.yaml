# yaml-language-server: $schema=./schema.json
slug: hackerone
display_name: "HackerOne"
category: security
website: https://www.hackerone.com
aliases: ["HackerOne"]
provider_keys: []
services:
  - key: hackerone.verification
    display_name: "HackerOne domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (HackerOne)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "h1-domain-verification="}
