# yaml-language-server: $schema=./schema.json
slug: docusign
display_name: "DocuSign"
category: saas
website: https://www.docusign.com
aliases: ["DocuSign"]
provider_keys: []
services:
  - key: docusign.verification
    display_name: "DocuSign domain verification"
    service_types: [saas_verification]
    note: "Ported from technology_fingerprints (DocuSign)."
    dns_rules:
      - {record_type: TXT, match_field: value, matcher_type: prefix, pattern: "docusign="}
