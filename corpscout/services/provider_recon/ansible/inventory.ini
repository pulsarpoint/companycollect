[provider_recon_hosts]
# `companycollect` resolves through the operator's SSH configuration.
companycollect ansible_host=companycollect ansible_user=graovic ansible_python_interpreter=/usr/bin/python3

[dns_detect_hosts]
# The Dagster host runs the initial scan (16 cores, 121 GB); moving the
# service later is a change of this group and of Dagster's DNS_DETECT_API_URL.
dagster ansible_host=dagster ansible_user=graovic ansible_python_interpreter=/usr/bin/python3
