[project]
name = "crawler-ratsit"
version = "0.1.0"
description = "Temporal worker for durable Ratsit company crawls"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.42.97",
    "click>=8.4.2",
    "clickhouse-connect>=1.3.0",
    "cloakbrowser[geoip]>=0.5.8",
    "playwright>=1.62.0",
    "temporalio>=1.28.0",
]

[project.scripts]
ratsit-process = "crawler_ratsit.process:main"
ratsit-crawl = "crawler_ratsit.start:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/crawler_ratsit/ansible",
]

[tool.hatch.build.targets.wheel]
packages = ["crawler_ratsit"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly enabled live external service",
]
