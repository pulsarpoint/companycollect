[project]
name = "ratsit-speed-probe"
version = "0.1.0"
description = "Standalone Ratsit request-rate probe"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cloakbrowser[geoip]>=0.5.8",
    "scrapling[fetchers]>=0.4.15",
]

[project.scripts]
ratsit-speed-probe = "ratsit_speed_probe.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratsit_speed_probe"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
