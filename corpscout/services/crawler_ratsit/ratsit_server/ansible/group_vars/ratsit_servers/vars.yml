---
ratsit_server_service_name: ratsit-cdp
ratsit_server_service_user: graovic
ratsit_server_service_uid: 1000
ratsit_server_service_group: graovic
ratsit_server_service_home: /home/graovic
ratsit_server_runtime_dir: "/run/user/{{ ratsit_server_service_uid }}"
ratsit_server_user_unit_dir: >-
  {{ ratsit_server_service_home }}/.config/systemd/user
ratsit_server_user_unit_file: >-
  {{ ratsit_server_user_unit_dir }}/{{ ratsit_server_service_name }}.service
ratsit_server_config_dir: >-
  {{ ratsit_server_service_home }}/.config/ratsit-server

ratsit_server_source_dir: "{{ playbook_dir }}/../.."
ratsit_server_deploy_dir: /opt/companycollect/corpscout/ratsit-server
ratsit_server_state_dir: /var/lib/ratsit-server
ratsit_server_cache_dir: /var/cache/ratsit-server
ratsit_server_profile_dir: "{{ ratsit_server_state_dir }}/profile"
ratsit_server_environment_file: "{{ ratsit_server_config_dir }}/environment"
ratsit_server_legacy_system_unit: >-
  /etc/systemd/system/{{ ratsit_server_service_name }}.service

# Leave empty to discover uv from the SSH user's login environment.
# Set an absolute path here when the target needs an explicit override.
ratsit_server_uv_binary: ""
ratsit_server_python_version: "3.14"
ratsit_server_uv_python_dir: "{{ ratsit_server_deploy_dir }}/.uv-python"
ratsit_server_uv_cache_dir: "{{ ratsit_server_deploy_dir }}/.uv-cache"

# Keep CDP on loopback. Use an SSH tunnel if a worker on another host needs it.
ratsit_server_bind_address: 127.0.0.1
ratsit_server_cdp_port: 9222
