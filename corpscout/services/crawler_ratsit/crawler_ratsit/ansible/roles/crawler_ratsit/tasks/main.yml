---
- name: Inspect the local Ratsit process source files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ crawler_ratsit_source_dir }}/pyproject.toml"
    - "{{ crawler_ratsit_source_dir }}/uv.lock"
    - "{{ crawler_ratsit_source_dir }}/crawler_ratsit/process.py"
    - "{{ crawler_ratsit_source_dir }}/tests/test_workflow.py"
  register: crawler_ratsit_local_source_files
  delegate_to: localhost
  become: false
  run_once: true

- name: Discover the local Ratsit process Python files
  ansible.builtin.set_fact:
    crawler_ratsit_python_files: >-
      {{ query(
        'ansible.builtin.fileglob',
        crawler_ratsit_source_dir ~ '/crawler_ratsit/*.py'
      ) }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Inspect the local Ratsit process environment
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_environment_source }}"
  register: crawler_ratsit_local_environment
  delegate_to: localhost
  become: false
  run_once: true

- name: Inspect the local Ratsit browser pool config
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_process_config_source }}"
  register: crawler_ratsit_local_process_config
  delegate_to: localhost
  become: false
  run_once: true

- name: Require a complete local Ratsit process source tree
  ansible.builtin.assert:
    that:
      - crawler_ratsit_local_source_files.results | map(attribute='stat.exists') | min
      - crawler_ratsit_python_files | length > 0
    fail_msg: >-
      Run this playbook from crawler_ratsit/ansible; the project files,
      process, or process tests are missing.
  delegate_to: localhost
  become: false
  run_once: true

- name: Require the ignored Ratsit process configuration files
  ansible.builtin.assert:
    that:
      - crawler_ratsit_local_environment.stat.isreg | default(false)
      - crawler_ratsit_local_process_config.stat.isreg | default(false)
    fail_msg: >-
      Copy worker-environment.example to worker-environment, configure its
      Temporal, S3, ClickHouse, and CloakBrowser values; copy
      process-config.toml.example to process-config.toml, chmod it 0600,
      configure browsers and proxies, and retry the deployment.
  delegate_to: localhost
  become: false
  run_once: true

- name: Reject placeholder Ratsit process credentials
  ansible.builtin.assert:
    that:
      - >-
        'change-me' not in lookup(
          'ansible.builtin.file',
          crawler_ratsit_environment_source
        )
    fail_msg: >-
      Replace every change-me value in worker-environment before deploying.
  delegate_to: localhost
  become: false
  run_once: true

- name: Require pyproject.toml and uv.lock to agree
  ansible.builtin.command:
    argv:
      - uv
      - lock
      - --check
    chdir: "{{ crawler_ratsit_source_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false

- name: Validate the Ratsit process configuration on the control machine
  ansible.builtin.command:
    argv:
      - uv
      - run
      - --frozen
      - --env-file
      - "{{ crawler_ratsit_environment_source }}"
      - python
      - -c
      - >-
        import os; from pathlib import Path;
        from crawler_ratsit.config import ProcessSettings, WorkerSettings;
        WorkerSettings.from_environment(os.environ);
        ProcessSettings.from_file(Path("{{ crawler_ratsit_process_config_source }}"))
    chdir: "{{ crawler_ratsit_source_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false
  no_log: true

- name: Test the Ratsit process on the control machine
  ansible.builtin.command:
    argv:
      - uv
      - run
      - --frozen
      - pytest
      - tests
      - --ignore=tests/integration
    chdir: "{{ crawler_ratsit_source_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false

- name: Require a supported Ratsit process target
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      This deployment supports Linux on x86-64 or arm64.

- name: Discover uv from the SSH user's login environment
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -lc
      - command -v uv
  become: false
  register: crawler_ratsit_discovered_uv
  check_mode: false
  changed_when: false
  failed_when: false
  when: crawler_ratsit_uv_binary | length == 0

- name: Select the target uv executable
  ansible.builtin.set_fact:
    crawler_ratsit_uv_executable: >-
      {{
        crawler_ratsit_uv_binary
        if crawler_ratsit_uv_binary | length > 0
        else crawler_ratsit_discovered_uv.stdout | default('') | trim
      }}

- name: Require an absolute target uv path
  ansible.builtin.assert:
    that:
      - crawler_ratsit_uv_executable | length > 0
      - crawler_ratsit_uv_executable.startswith('/')
    fail_msg: >-
      uv was not found in the SSH user's login environment. Install uv or set
      crawler_ratsit_uv_binary to its absolute path before deploying.

- name: Inspect uv on the target host
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_uv_executable }}"
  register: crawler_ratsit_target_uv

- name: Require uv on the target host
  ansible.builtin.assert:
    that:
      - crawler_ratsit_target_uv.stat.exists
      - crawler_ratsit_target_uv.stat.executable
    fail_msg: >-
      {{ crawler_ratsit_uv_executable }} is missing or not executable. Install
      uv or set crawler_ratsit_uv_binary to its absolute path before deploying.

- name: Read the Ratsit process user's UID
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ crawler_ratsit_service_user }}"
  register: crawler_ratsit_actual_service_uid
  check_mode: false
  changed_when: false

- name: Read the Ratsit process user's primary group
  ansible.builtin.command:
    argv:
      - id
      - -gn
      - "{{ crawler_ratsit_service_user }}"
  register: crawler_ratsit_actual_service_group
  check_mode: false
  changed_when: false

- name: Require the configured UID 1000 Ratsit process user
  ansible.builtin.assert:
    that:
      - crawler_ratsit_actual_service_uid.stdout | int == crawler_ratsit_service_uid
      - crawler_ratsit_actual_service_group.stdout == crawler_ratsit_service_group
    fail_msg: >-
      {{ crawler_ratsit_service_user }} must be UID
      {{ crawler_ratsit_service_uid }} with primary group
      {{ crawler_ratsit_service_group }}.

- name: Enable lingering for the Ratsit process user
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ crawler_ratsit_service_user }}"
    creates: "/var/lib/systemd/linger/{{ crawler_ratsit_service_user }}"

- name: Start the Ratsit process user manager
  ansible.builtin.systemd_service:
    name: "user@{{ crawler_ratsit_service_uid }}.service"
    state: started
  when: not ansible_check_mode

- name: Wait for the Ratsit process user bus
  ansible.builtin.wait_for:
    path: "{{ crawler_ratsit_runtime_dir }}/bus"
    state: present
    timeout: 30
  when: not ansible_check_mode

- name: Read the graphical user manager environment
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - show-environment
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  register: crawler_ratsit_user_manager_environment
  check_mode: false
  changed_when: false
  failed_when: false

- name: Inspect the graphical session target
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - graphical-session.target
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  register: crawler_ratsit_graphical_target
  check_mode: false
  changed_when: false
  failed_when: false

- name: Require the active UID 1000 graphical session
  ansible.builtin.assert:
    that:
      - "'DISPLAY=' in crawler_ratsit_user_manager_environment.stdout"
      - "'XAUTHORITY=' in crawler_ratsit_user_manager_environment.stdout"
      - crawler_ratsit_graphical_target.stdout == 'active'
    fail_msg: >-
      {{ crawler_ratsit_service_user }} must have an active
      graphical-session.target with DISPLAY and XAUTHORITY imported into the
      systemd user manager before deploying headed CloakBrowser contexts.

- name: Install browser runtime packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect the deployment directory before check-mode changes
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_deploy_dir }}"
  register: crawler_ratsit_existing_deploy_dir
  check_mode: false

- name: Inspect the user unit directory before check-mode changes
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_user_unit_dir }}"
  register: crawler_ratsit_existing_user_unit_dir
  check_mode: false

- name: Create the root-owned process deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ crawler_ratsit_deploy_dir }}"
    - "{{ crawler_ratsit_deploy_dir }}/crawler_ratsit"

- name: Create persistent CloakBrowser directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "0700"
  loop:
    - "{{ crawler_ratsit_state_dir }}"
    - "{{ crawler_ratsit_cache_dir }}"

- name: Create the Ratsit process user directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ crawler_ratsit_user_unit_dir }}"
      mode: "0755"
    - path: "{{ crawler_ratsit_config_dir }}"
      mode: "0700"

- name: Install the protected Ratsit process environment
  ansible.builtin.copy:
    src: "{{ crawler_ratsit_environment_source }}"
    dest: "{{ crawler_ratsit_environment_file }}"
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "0600"
  notify: Restart Ratsit process
  no_log: true
  when: not ansible_check_mode

- name: Install the protected Ratsit browser pool config
  ansible.builtin.copy:
    src: "{{ crawler_ratsit_process_config_source }}"
    dest: "{{ crawler_ratsit_process_config_file }}"
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "0600"
  notify: Restart Ratsit process
  no_log: true
  when: not ansible_check_mode

- name: Install the locked Python project metadata
  ansible.builtin.copy:
    src: "{{ crawler_ratsit_source_dir }}/{{ item }}"
    dest: "{{ crawler_ratsit_deploy_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pyproject.toml
    - uv.lock
  notify: Restart Ratsit process
  when:
    - >-
      not ansible_check_mode
      or crawler_ratsit_existing_deploy_dir.stat.isdir | default(false)

- name: Install the Ratsit process sources
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: >-
      {{ crawler_ratsit_deploy_dir }}/crawler_ratsit/{{ item | basename }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ crawler_ratsit_python_files }}"
  notify: Restart Ratsit process
  when:
    - >-
      not ansible_check_mode
      or crawler_ratsit_existing_deploy_dir.stat.isdir | default(false)

- name: Synchronize the process Python 3.14 runtime environment
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_uv_executable }}"
      - sync
      - --frozen
      - --no-dev
      - --no-install-project
      - --python
      - "{{ crawler_ratsit_python_version }}"
    chdir: "{{ crawler_ratsit_deploy_dir }}"
  environment:
    UV_CACHE_DIR: "{{ crawler_ratsit_uv_cache_dir }}"
    UV_PYTHON_INSTALL_DIR: "{{ crawler_ratsit_uv_python_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify the CloakBrowser GeoIP dependency
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_deploy_dir }}/.venv/bin/python"
      - -c
      - import geoip2
  changed_when: false
  when: not ansible_check_mode

- name: Install Chromium shared-library dependencies
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_deploy_dir }}/.venv/bin/playwright"
      - install-deps
      - chromium
  changed_when: false
  when: not ansible_check_mode

- name: Download and verify the CloakBrowser binary
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_deploy_dir }}/.venv/bin/python"
      - -m
      - cloakbrowser
      - install
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    HOME: "{{ crawler_ratsit_service_home }}"
    CLOAKBROWSER_CACHE_DIR: "{{ crawler_ratsit_cache_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify the deployed Ratsit process imports
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_deploy_dir }}/.venv/bin/python"
      - -c
      - from crawler_ratsit.process import main
    chdir: "{{ crawler_ratsit_deploy_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Install the Ratsit process user unit
  ansible.builtin.template:
    src: ratsit-process.service.j2
    dest: "{{ crawler_ratsit_user_unit_file }}"
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "0644"
  notify: Restart Ratsit process
  when:
    - >-
      not ansible_check_mode
      or crawler_ratsit_existing_user_unit_dir.stat.isdir | default(false)

- name: Verify the installed Ratsit process user unit
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - --user
      - verify
      - "{{ crawler_ratsit_user_unit_file }}"
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  changed_when: false
  when: not ansible_check_mode

- name: Inspect retired Ratsit user units
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_user_unit_dir }}/{{ item }}.service"
  loop: "{{ crawler_ratsit_retired_service_names }}"
  register: crawler_ratsit_retired_user_units
  check_mode: false

- name: Stop and disable retired Ratsit user services
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    scope: user
    enabled: false
    state: stopped
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  loop: "{{ crawler_ratsit_retired_user_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: Remove retired Ratsit user units
  ansible.builtin.file:
    path: "{{ crawler_ratsit_user_unit_dir }}/{{ item }}.service"
    state: absent
  loop: "{{ crawler_ratsit_retired_service_names }}"

- name: Apply pending Ratsit process changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Ratsit process
  ansible.builtin.systemd_service:
    name: "{{ crawler_ratsit_service_name }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  when: not ansible_check_mode

- name: Verify the Ratsit process remains active
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - "{{ crawler_ratsit_service_name }}"
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  register: crawler_ratsit_worker_active
  until: crawler_ratsit_worker_active.stdout == 'active'
  retries: 10
  delay: 2
  changed_when: false
  when: not ansible_check_mode
