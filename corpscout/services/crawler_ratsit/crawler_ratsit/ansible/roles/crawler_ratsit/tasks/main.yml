---
- name: Inspect the local Ratsit worker source files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ crawler_ratsit_source_dir }}/pyproject.toml"
    - "{{ crawler_ratsit_source_dir }}/uv.lock"
    - "{{ crawler_ratsit_source_dir }}/crawler_ratsit/worker.py"
    - "{{ crawler_ratsit_source_dir }}/tests/test_workflow.py"
  register: crawler_ratsit_local_source_files
  delegate_to: localhost
  become: false
  run_once: true

- name: Discover the local Ratsit worker Python files
  ansible.builtin.set_fact:
    crawler_ratsit_python_files: >-
      {{ query(
        'ansible.builtin.fileglob',
        crawler_ratsit_source_dir ~ '/crawler_ratsit/*.py'
      ) }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Inspect the local Ratsit worker environment
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_environment_source }}"
  register: crawler_ratsit_local_environment
  delegate_to: localhost
  become: false
  run_once: true

- name: Require a complete local Ratsit worker source tree
  ansible.builtin.assert:
    that:
      - crawler_ratsit_local_source_files.results | map(attribute='stat.exists') | min
      - crawler_ratsit_python_files | length > 0
    fail_msg: >-
      Run this playbook from crawler_ratsit/ansible; the project files,
      worker, or worker tests are missing.
  delegate_to: localhost
  become: false
  run_once: true

- name: Require the ignored Ratsit worker environment file
  ansible.builtin.assert:
    that:
      - crawler_ratsit_local_environment.stat.isreg | default(false)
    fail_msg: >-
      Copy worker-environment.example to worker-environment, configure its
      CDP, Temporal, S3, and ClickHouse values, and retry the deployment.
  delegate_to: localhost
  become: false
  run_once: true

- name: Reject placeholder Ratsit worker credentials
  ansible.builtin.assert:
    that:
      - >-
        'change-me' not in lookup(
          'ansible.builtin.file',
          crawler_ratsit_environment_source
        )
    fail_msg: >-
      Replace every change-me value in worker-environment before deploying.
  delegate_to: localhost
  become: false
  run_once: true

- name: Require pyproject.toml and uv.lock to agree
  ansible.builtin.command:
    argv:
      - uv
      - lock
      - --check
    chdir: "{{ crawler_ratsit_source_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false

- name: Validate the Ratsit worker environment on the control machine
  ansible.builtin.command:
    argv:
      - uv
      - run
      - --frozen
      - --env-file
      - "{{ crawler_ratsit_environment_source }}"
      - python
      - -c
      - >-
        import os; from crawler_ratsit.config import WorkerSettings;
        WorkerSettings.from_environment(os.environ)
    chdir: "{{ crawler_ratsit_source_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false
  no_log: true

- name: Test the Ratsit worker on the control machine
  ansible.builtin.command:
    argv:
      - uv
      - run
      - --frozen
      - pytest
      - tests
      - --ignore=tests/integration
      - --ignore=tests/test_ratsit_server.py
    chdir: "{{ crawler_ratsit_source_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false

- name: Require a supported Ratsit worker target
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      This deployment supports Linux on x86-64 or arm64.

- name: Discover uv from the SSH user's login environment
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -lc
      - command -v uv
  become: false
  register: crawler_ratsit_discovered_uv
  check_mode: false
  changed_when: false
  failed_when: false
  when: crawler_ratsit_uv_binary | length == 0

- name: Select the target uv executable
  ansible.builtin.set_fact:
    crawler_ratsit_uv_executable: >-
      {{
        crawler_ratsit_uv_binary
        if crawler_ratsit_uv_binary | length > 0
        else crawler_ratsit_discovered_uv.stdout | default('') | trim
      }}

- name: Require an absolute target uv path
  ansible.builtin.assert:
    that:
      - crawler_ratsit_uv_executable | length > 0
      - crawler_ratsit_uv_executable.startswith('/')
    fail_msg: >-
      uv was not found in the SSH user's login environment. Install uv or set
      crawler_ratsit_uv_binary to its absolute path before deploying.

- name: Inspect uv on the target host
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_uv_executable }}"
  register: crawler_ratsit_target_uv

- name: Require uv on the target host
  ansible.builtin.assert:
    that:
      - crawler_ratsit_target_uv.stat.exists
      - crawler_ratsit_target_uv.stat.executable
    fail_msg: >-
      {{ crawler_ratsit_uv_executable }} is missing or not executable. Install
      uv or set crawler_ratsit_uv_binary to its absolute path before deploying.

- name: Read the Ratsit worker user's UID
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ crawler_ratsit_service_user }}"
  register: crawler_ratsit_actual_service_uid
  check_mode: false
  changed_when: false

- name: Read the Ratsit worker user's primary group
  ansible.builtin.command:
    argv:
      - id
      - -gn
      - "{{ crawler_ratsit_service_user }}"
  register: crawler_ratsit_actual_service_group
  check_mode: false
  changed_when: false

- name: Require the configured UID 1000 Ratsit worker user
  ansible.builtin.assert:
    that:
      - crawler_ratsit_actual_service_uid.stdout | int == crawler_ratsit_service_uid
      - crawler_ratsit_actual_service_group.stdout == crawler_ratsit_service_group
    fail_msg: >-
      {{ crawler_ratsit_service_user }} must be UID
      {{ crawler_ratsit_service_uid }} with primary group
      {{ crawler_ratsit_service_group }}.

- name: Enable lingering for the Ratsit worker user
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ crawler_ratsit_service_user }}"
    creates: "/var/lib/systemd/linger/{{ crawler_ratsit_service_user }}"

- name: Start the Ratsit worker user manager
  ansible.builtin.systemd_service:
    name: "user@{{ crawler_ratsit_service_uid }}.service"
    state: started
  when: not ansible_check_mode

- name: Wait for the Ratsit worker user bus
  ansible.builtin.wait_for:
    path: "{{ crawler_ratsit_runtime_dir }}/bus"
    state: present
    timeout: 30
  when: not ansible_check_mode

- name: Inspect the deployment directory before check-mode changes
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_deploy_dir }}"
  register: crawler_ratsit_existing_deploy_dir
  check_mode: false

- name: Inspect the user unit directory before check-mode changes
  ansible.builtin.stat:
    path: "{{ crawler_ratsit_user_unit_dir }}"
  register: crawler_ratsit_existing_user_unit_dir
  check_mode: false

- name: Create the root-owned worker deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ crawler_ratsit_deploy_dir }}"
    - "{{ crawler_ratsit_deploy_dir }}/crawler_ratsit"

- name: Create the Ratsit worker user directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ crawler_ratsit_user_unit_dir }}"
      mode: "0755"
    - path: "{{ crawler_ratsit_config_dir }}"
      mode: "0700"

- name: Install the protected Ratsit worker environment
  ansible.builtin.copy:
    src: "{{ crawler_ratsit_environment_source }}"
    dest: "{{ crawler_ratsit_environment_file }}"
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "0600"
  notify: Restart Ratsit worker
  no_log: true
  when: not ansible_check_mode

- name: Install the locked Python project metadata
  ansible.builtin.copy:
    src: "{{ crawler_ratsit_source_dir }}/{{ item }}"
    dest: "{{ crawler_ratsit_deploy_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pyproject.toml
    - uv.lock
  notify: Restart Ratsit worker
  when:
    - >-
      not ansible_check_mode
      or crawler_ratsit_existing_deploy_dir.stat.isdir | default(false)

- name: Install the Ratsit worker sources
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: >-
      {{ crawler_ratsit_deploy_dir }}/crawler_ratsit/{{ item | basename }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ crawler_ratsit_python_files }}"
  notify: Restart Ratsit worker
  when:
    - >-
      not ansible_check_mode
      or crawler_ratsit_existing_deploy_dir.stat.isdir | default(false)

- name: Synchronize the worker Python 3.14 runtime environment
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_uv_executable }}"
      - sync
      - --frozen
      - --no-dev
      - --no-install-project
      - --python
      - "{{ crawler_ratsit_python_version }}"
    chdir: "{{ crawler_ratsit_deploy_dir }}"
  environment:
    UV_CACHE_DIR: "{{ crawler_ratsit_uv_cache_dir }}"
    UV_PYTHON_INSTALL_DIR: "{{ crawler_ratsit_uv_python_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify the deployed Ratsit worker imports
  ansible.builtin.command:
    argv:
      - "{{ crawler_ratsit_deploy_dir }}/.venv/bin/python"
      - -c
      - from crawler_ratsit.worker import main
    chdir: "{{ crawler_ratsit_deploy_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Install the Ratsit worker user unit
  ansible.builtin.template:
    src: ratsit-worker.service.j2
    dest: "{{ crawler_ratsit_user_unit_file }}"
    owner: "{{ crawler_ratsit_service_user }}"
    group: "{{ crawler_ratsit_service_group }}"
    mode: "0644"
  notify: Restart Ratsit worker
  when:
    - >-
      not ansible_check_mode
      or crawler_ratsit_existing_user_unit_dir.stat.isdir | default(false)

- name: Verify the installed Ratsit worker user unit
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - --user
      - verify
      - "{{ crawler_ratsit_user_unit_file }}"
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  changed_when: false
  when: not ansible_check_mode

- name: Apply pending Ratsit worker changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Ratsit Temporal worker
  ansible.builtin.systemd_service:
    name: "{{ crawler_ratsit_service_name }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  when: not ansible_check_mode

- name: Verify the Ratsit Temporal worker remains active
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - "{{ crawler_ratsit_service_name }}"
  become: true
  become_user: "{{ crawler_ratsit_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ crawler_ratsit_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ crawler_ratsit_runtime_dir }}/bus
  register: crawler_ratsit_worker_active
  until: crawler_ratsit_worker_active.stdout == 'active'
  retries: 10
  delay: 2
  changed_when: false
  when: not ansible_check_mode
