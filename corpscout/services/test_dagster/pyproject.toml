[project]
name = "test_dagster"
requires-python = ">=3.14,<3.15"
version = "0.1.0"
dependencies = [
    "cloakbrowser>=0.4.10",
    "dagster==1.13.9",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "test_dagster"
registry_modules = [
    "test_dagster.components.*",
]
