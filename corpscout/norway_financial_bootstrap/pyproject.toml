[project]
name = "norway-financial-bootstrap"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.43.29",
    "polars[rtcompat]>=1.41.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "temporalio>=1.28.0",
]

[project.scripts]
norway-financial-bootstrap = "norway_financial_bootstrap.cli:main"
norway-financial-bootstrap-worker = "norway_financial_bootstrap.worker:worker_main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["norway_financial_bootstrap"]
