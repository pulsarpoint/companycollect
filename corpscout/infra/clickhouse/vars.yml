---
# Deployment target
clickhouse_dir: /opt/clickhouse

# Secrets (clickhouse_password, backblaze_key_id/key_name/app_key) live in the
# git-ignored secrets.yml next to this file; see secrets.yml.example.

# ClickHouse — image version is pinned in docker-compose.yml.
clickhouse_db: corpscout_sources
clickhouse_user: default
# Required so migrations can provision least-privilege service users
# (see README.md). The default account stays protected by the password.
clickhouse_default_access_management: 1
clickhouse_http_port: 8123
clickhouse_native_port: 9002

# Backblaze B2 — S3 endpoint used by the clickhouse-backup sidecar. The key
# (in secrets.yml) is restricted to the backup bucket: list/read/write/delete
# files only.
backblaze_endpoint: s3.us-east-005.backblazeb2.com

# Backups — clickhouse-backup sidecar (watch mode) uploading to Backblaze B2.
backup_s3_bucket: main-ch-backup
backup_s3_region: us-east-005
backups_to_keep_remote: 3
