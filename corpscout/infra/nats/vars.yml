---
# Secrets (nats_app_password, nats_sys_password) live in the git-ignored
# secrets.yml next to this file; see secrets.yml.example.

# nats-server release (pinned; bump version + checksum deliberately, then
# re-run install.yml — the binary swap restarts the service).
nats_version: "2.14.7"
nats_tarball_url: "https://github.com/nats-io/nats-server/releases/download/v{{ nats_version }}/nats-server-v{{ nats_version }}-linux-amd64.tar.gz"
nats_tarball_sha256: "e5c20b1cb2c0566b54c544312e91e011f9e130c5c80f16a14f4cf28ef30b8be2"
nats_archive_path: "/usr/local/src/nats-server-v{{ nats_version }}-linux-amd64.tar.gz"
nats_release_dir: "/usr/local/lib/nats-server/{{ nats_version }}"
nats_release_binary: "{{ nats_release_dir }}/nats-server"

# nats CLI (natscli) — used by the install verification and for operations.
natscli_version: "0.4.0"
natscli_zip_url: "https://github.com/nats-io/natscli/releases/download/v{{ natscli_version }}/nats-{{ natscli_version }}-linux-amd64.zip"
natscli_zip_sha256: "8dbd437c826b953dbd7432cf890ef22ba3c33dccc3dce5e71b3e8d055427849c"
natscli_archive_path: "/usr/local/src/nats-{{ natscli_version }}-linux-amd64.zip"
natscli_release_dir: "/usr/local/lib/natscli/{{ natscli_version }}"
natscli_release_binary: "{{ natscli_release_dir }}/nats-{{ natscli_version }}-linux-amd64/nats"

# JetStream data — dedicated XFS logical volume carved from the free space in
# the root volume group, so a full JetStream store can never fill the root
# filesystem. Growth path: raise nats_lv_size (and nats_max_file_store) here
# and re-run install.yml; the LV and filesystem grow online, never shrink.
nats_vg: ubuntu-vg
nats_lv: nats-data
nats_lv_size: 100g
nats_mount_point: /var/lib/nats

# Service
nats_user: nats
nats_group: nats
nats_config_dir: /etc/nats
nats_server_name: nats
nats_listen_host: 0.0.0.0
nats_client_port: 4222
# HTTP monitoring is unauthenticated and read-only; LAN-visible like the other
# infra consoles. Set nats_monitor_host to 127.0.0.1 to keep it host-local.
nats_monitor_host: 0.0.0.0
nats_monitor_port: 8222

# JetStream limits — the file store stays below the 100 GiB volume; the memory
# store is a fraction of the host's 15 GiB.
nats_max_file_store: 90GiB
nats_max_memory_store: 4GiB

# Accounts — streams belong to an account, so the application account is named
# up front. SYS is the system account behind `nats server ...` admin commands.
nats_app_account: CORPSCOUT
nats_app_user: corpscout
nats_sys_user: sys
