---
- name: Install NATS (JetStream) as a systemd service
  hosts: nats_servers
  become: true
  vars_files:
    - vars.yml
    - secrets.yml # git-ignored; copy secrets.yml.example

  tasks:
    # -------------------------------------------------------------- storage
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - lvm2
          - xfsprogs
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    # shrink: false — a volume grown by hand is left alone instead of failing
    # the run; raising nats_lv_size grows the LV and its filesystem online.
    - name: Create JetStream logical volume
      community.general.lvol:
        vg: "{{ nats_vg }}"
        lv: "{{ nats_lv }}"
        size: "{{ nats_lv_size }}"
        shrink: false
        resizefs: true

    - name: Format JetStream volume as XFS (skipped if filesystem already exists)
      community.general.filesystem:
        dev: "/dev/{{ nats_vg }}/{{ nats_lv }}"
        fstype: xfs

    - name: Mount JetStream volume and persist in fstab
      ansible.posix.mount:
        path: "{{ nats_mount_point }}"
        src: "/dev/{{ nats_vg }}/{{ nats_lv }}"
        fstype: xfs
        opts: defaults,noatime
        state: mounted

    # ------------------------------------------------------- user and dirs
    - name: Create nats group
      ansible.builtin.group:
        name: "{{ nats_group }}"
        system: true

    - name: Create nats system user
      ansible.builtin.user:
        name: "{{ nats_user }}"
        group: "{{ nats_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Own the JetStream mount point
      ansible.builtin.file:
        path: "{{ nats_mount_point }}"
        state: directory
        owner: "{{ nats_user }}"
        group: "{{ nats_group }}"
        mode: "0750"

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ nats_config_dir }}"
        state: directory
        owner: root
        group: "{{ nats_group }}"
        mode: "0750"

    # ------------------------------------------------------------- binaries
    - name: Download nats-server release archive
      ansible.builtin.get_url:
        url: "{{ nats_tarball_url }}"
        dest: "{{ nats_archive_path }}"
        checksum: "sha256:{{ nats_tarball_sha256 }}"
        mode: "0644"

    - name: Create versioned nats-server release directory
      ansible.builtin.file:
        path: "{{ nats_release_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack nats-server release archive
      ansible.builtin.unarchive:
        src: "{{ nats_archive_path }}"
        dest: "{{ nats_release_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: "{{ nats_release_binary }}"

    - name: Install nats-server binary
      ansible.builtin.copy:
        src: "{{ nats_release_binary }}"
        dest: /usr/local/bin/nats-server
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart nats

    - name: Download nats CLI release archive
      ansible.builtin.get_url:
        url: "{{ natscli_zip_url }}"
        dest: "{{ natscli_archive_path }}"
        checksum: "sha256:{{ natscli_zip_sha256 }}"
        mode: "0644"

    - name: Create versioned nats CLI release directory
      ansible.builtin.file:
        path: "{{ natscli_release_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack nats CLI release archive
      ansible.builtin.unarchive:
        src: "{{ natscli_archive_path }}"
        dest: "{{ natscli_release_dir }}"
        remote_src: true
        creates: "{{ natscli_release_binary }}"

    - name: Install nats CLI binary
      ansible.builtin.copy:
        src: "{{ natscli_release_binary }}"
        dest: /usr/local/bin/nats
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    # ------------------------------------------------------- config/service
    - name: Write nats-server.conf
      ansible.builtin.template:
        src: templates/nats-server.conf.j2
        dest: "{{ nats_config_dir }}/nats-server.conf"
        owner: root
        group: "{{ nats_group }}"
        mode: "0640"
        validate: /usr/local/bin/nats-server -t -c %s
      notify: Restart nats

    - name: Write systemd unit
      ansible.builtin.template:
        src: templates/nats.service.j2
        dest: /etc/systemd/system/nats.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart nats

    - name: Enable and start nats
      ansible.builtin.systemd_service:
        name: nats
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    # ---------------------------------------------------------- verification
    - name: Wait for client port
      ansible.builtin.wait_for:
        port: "{{ nats_client_port }}"
        host: 127.0.0.1
        timeout: 60

    - name: Probe JetStream health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nats_monitor_port }}/healthz?js-enabled-only=true"
        return_content: true
      register: health_probe
      retries: 10
      delay: 3
      until: health_probe.status == 200

    # A real write through the application account: proves the credentials,
    # that JetStream is enabled for the account, and that the store is
    # writable. Only a stream capturing every subject (`>`) would overlap the
    # temporary one.
    - name: Verify a JetStream round trip as the application user
      environment:
        NATS_URL: "nats://127.0.0.1:{{ nats_client_port }}"
        NATS_USER: "{{ nats_app_user }}"
        NATS_PASSWORD: "{{ nats_app_password }}"
      block:
        - name: Remove any leftover verification stream
          ansible.builtin.command: /usr/local/bin/nats stream rm -f INSTALL_VERIFY
          changed_when: false
          failed_when: false

        - name: Create temporary file-backed stream
          ansible.builtin.command: >-
            /usr/local/bin/nats stream add INSTALL_VERIFY
            --subjects=_INSTALL_VERIFY.ping --storage=file --defaults
          changed_when: false

        - name: Publish and wait for the JetStream ack
          ansible.builtin.command: >-
            /usr/local/bin/nats request --raw _INSTALL_VERIFY.ping
            "install.yml verification"
          changed_when: false
          register: js_ack
          failed_when: js_ack.rc != 0 or (js_ack.stdout | from_json).seq != 1

        - name: Read the stored message count back
          ansible.builtin.command: /usr/local/bin/nats stream info INSTALL_VERIFY --json
          changed_when: false
          register: js_info
          failed_when: js_info.rc != 0 or (js_info.stdout | from_json).state.messages != 1
      always:
        - name: Remove temporary stream
          ansible.builtin.command: /usr/local/bin/nats stream rm -f INSTALL_VERIFY
          changed_when: false
          failed_when: false

    - name: Verify the system account
      ansible.builtin.command: /usr/local/bin/nats server ping 1
      environment:
        NATS_URL: "nats://127.0.0.1:{{ nats_client_port }}"
        NATS_USER: "{{ nats_sys_user }}"
        NATS_PASSWORD: "{{ nats_sys_password }}"
      changed_when: false

    - name: Report service state
      ansible.builtin.command: systemctl is-active nats
      changed_when: false
      register: svc_state

    - name: Show verification result
      ansible.builtin.debug:
        msg: >-
          nats {{ svc_state.stdout }}, JetStream health
          {{ health_probe.json.status | default(health_probe.content | trim) }},
          round trip stored seq {{ (js_ack.stdout | from_json).seq }}
          in stream {{ (js_ack.stdout | from_json).stream }}

  handlers:
    - name: Restart nats
      ansible.builtin.systemd_service:
        name: nats
        state: restarted
        daemon_reload: true
