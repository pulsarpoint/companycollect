services:
  migrate:
    image: migrate/migrate:v4.17.0
    extra_hosts:
      - "companycollect:100.85.212.113"
    volumes:
      - ./database/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL:-postgres://corpscout:change-me@companycollect:5432/corpscout?sslmode=disable}"
      - "up"

  postgrest:
    image: postgrest/postgrest:v12.2.3
    extra_hosts:
      - "companycollect:100.85.212.113"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: ${DATABASE_URL:-postgres://corpscout:change-me@companycollect:5432/corpscout?sslmode=disable}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: corpscout_anon
      PGRST_DB_POOL: "5"
      PGRST_SERVER_PORT: "3000"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/rustfs:/data

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    extra_hosts:
      - "companycollect:100.85.212.113"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://corpscout:password123@companycollect:5432/corpscout?sslmode=disable}
      CORPSCOUT_LOG_LEVEL: ${CORPSCOUT_LOG_LEVEL:-info}
      CORPSCOUT_CRAWL_SERVICE_URL: ${CORPSCOUT_CRAWL_SERVICE_URL:-http://companycollect:8096}
      CORPSCOUT_NATS_URL: ${CORPSCOUT_NATS_URL:-nats://companycollect:4222}
      CORPSCOUT_NATS_REQUEST_TIMEOUT_SECONDS: ${CORPSCOUT_NATS_REQUEST_TIMEOUT_SECONDS:-900}
      CORPSCOUT_TRANSLATION_JETSTREAM_ENABLED: ${CORPSCOUT_TRANSLATION_JETSTREAM_ENABLED:-true}
      CORPSCOUT_TRANSLATION_SOURCE_BUFFER_TARGET: ${CORPSCOUT_TRANSLATION_SOURCE_BUFFER_TARGET:-2}
      CORPSCOUT_TRANSLATION_DISPATCH_INTERVAL_SECONDS: ${CORPSCOUT_TRANSLATION_DISPATCH_INTERVAL_SECONDS:-2}
      CORPSCOUT_TRANSLATION_BATCH_LEASE_SECONDS: ${CORPSCOUT_TRANSLATION_BATCH_LEASE_SECONDS:-1800}
      CORPSCOUT_POSTGREST_URL: http://postgrest:3000
      CORPSCOUT_LLM_PROVIDER_KEY_ENCRYPTION_KEY: ${CORPSCOUT_LLM_PROVIDER_KEY_ENCRYPTION_KEY:-}
      CORPSCOUT_BRREG_BULK_SOURCE_URL: ${CORPSCOUT_BRREG_BULK_SOURCE_URL:-https://data.brreg.no/enhetsregisteret/api/enheter/lastned}
      CORPSCOUT_FRANCE_LEGAL_UNITS_SOURCE_URL: ${CORPSCOUT_FRANCE_LEGAL_UNITS_SOURCE_URL:-https://www.data.gouv.fr/api/1/datasets/r/350182c9-148a-46e0-8389-76c2ec1374a3}
      CORPSCOUT_FRANCE_ESTABLISHMENTS_SOURCE_URL: ${CORPSCOUT_FRANCE_ESTABLISHMENTS_SOURCE_URL:-https://www.data.gouv.fr/api/1/datasets/r/a29c1297-1f92-4e2a-8f6b-8c902ce96c5f}
      CORPSCOUT_NACE_REV21_SOURCE_URL: ${CORPSCOUT_NACE_REV21_SOURCE_URL:-https://op.europa.eu/o/opportal-service/euvoc-download-handler?cellarURI=http%3A%2F%2Fpublications.europa.eu%2Fresource%2Fcellar%2Fbeb2efec-da9a-11ed-a05c-01aa75ed71a1.0001.02%2FDOC_1&fileName=ESTAT-NACE2.1.rdf}
      CORPSCOUT_FX_ECB_DAILY_URL: ${CORPSCOUT_FX_ECB_DAILY_URL:-https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
      CORPSCOUT_SOURCE_RUNS_ROOT: /var/lib/corpscout/source-runs
      CORPSCOUT_CLICKHOUSE_NATIVE_URL: ${CLICKHOUSE_NATIVE_URL:-clickhouse://companycollect:9002?username=default&password=change-me&database=corpscout_sources}
      CORPSCOUT_S3_ENDPOINT: http://rustfs:9000
      CORPSCOUT_S3_ACCESS_KEY: ${CORPSCOUT_S3_ACCESS_KEY:?CORPSCOUT_S3_ACCESS_KEY is required}
      CORPSCOUT_S3_SECRET_KEY: ${CORPSCOUT_S3_SECRET_KEY:?CORPSCOUT_S3_SECRET_KEY is required}
      CORPSCOUT_S3_BUCKET: crawls
      CORPSCOUT_TEMPORAL_HOST: companycollect:7233
      CORPSCOUT_TEMPORAL_UI_URL: http://100.85.212.113:8089
    ports:
      - "8092:8090"
    volumes:
      - ./data/scheduler-worksets:/var/lib/corpscout/worksets
      - ./data/source-runs:/var/lib/corpscout/source-runs
      - ../companies/data:/var/lib/corpscout/company-source-fixtures:ro
    restart: unless-stopped

  ui:
    build: ./ui
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8094:80"
    restart: unless-stopped
